<!DOCTYPE html>
<html lang="{{ current_lang }}" data-lang="{{ current_lang }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Alerts - Smart Tomato Crop Advisor</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="icon" type="image/png"
      href="{{ url_for('static', filename='images/tomato-favicon.png') }}">
</head>
<body>
    <span class="leaf l1">🌿</span><span class="leaf l2">🍃</span>
    <span class="leaf l3">🌱</span><span class="leaf l4">🍃</span>
    <nav class="navbar">
        <div class="brand"><span class="leaf-icon">🍅</span> Smart Tomato Crop Advisor</div>
        <button class="lang-toggle-btn" onclick="toggleLanguage()">{{ t('lang_toggle') }}</button>
    </nav>

<div class="page-container">
    <h2>🌦️ {{ t('weather_heading') }}</h2>
    <p>{{ t('weather_desc') }}</p>
    <div class="form-group">
        <label for="location">{{ t('location_label') }}</label>
        <input type="text" id="location" placeholder="e.g. Tiruchirappalli">
    </div>
    <button class="btn-primary" id="get-weather-btn">{{ t('get_weather_btn') }}</button>
    <div class="spinner" id="spinner">🌤️ Fetching forecast...</div>
    <div class="result-box" id="result-box"></div>
</div>

{% include "partials/chatbot.html" %}

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="{{ url_for("static", filename="js/lang.js") }}"></script>
<script src="{{ url_for("static", filename="js/weather.js") }}"></script>
<script src="{{ url_for("static", filename="js/chatbot.js") }}"></script>
</body>
</html>
